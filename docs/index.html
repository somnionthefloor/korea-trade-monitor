<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한국 상장 종목과 관련된 품목의 월별·국가별 수출입 통계">
  <title>한국 수출입 트래커</title>
  <link rel="stylesheet" href="styles.css">
  <script src="snapshot.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">본문으로 이동</a>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span><span>한국 수출입 트래커</span></div>
      <a href="#method" class="status"><span class="dot"></span>데이터 출처</a>
    </div>
  </header>
  <main id="main" class="shell">
    <nav id="watchlist" class="watchlist" aria-label="관심 종목"></nav>
    <section class="hero" aria-labelledby="company">
      <div>
        <span class="ticker" id="ticker"></span>
        <h1 id="company"></h1>
        <p id="series-label" class="muted"></p>
      </div>
      <div class="hero-meta">
        <span>통계 기준</span>
        <strong>한국 품목 통관</strong>
        <span id="company-scope"></span>
      </div>
    </section>
    <details class="mapping" id="mapping">
      <summary><span>TRASS 조회 조건과 매칭 근거</span><span id="mapping-caption"></span></summary>
      <div id="mapping-body" class="mapping-body"></div>
    </details>
    <div class="switches">
      <div class="segmented view-switch" aria-label="조회 화면">
        <button type="button" data-view="monthly" aria-pressed="true">월별·국가별</button>
        <button type="button" data-view="decile" aria-pressed="false">10일 단위</button>
      </div>
    </div>
    <section id="monthly" aria-label="월별·국가별 실적">
      <div class="toolbar">
        <div class="segmented" aria-label="수출입 구분">
          <button type="button" data-flow="X" aria-pressed="true">수출</button>
          <button type="button" data-flow="M" aria-pressed="false">수입</button>
        </div>
        <label class="field" id="product-field" hidden>품목<select id="product"></select></label>
        <label class="field">국가<select id="partner"></select></label>
        <label class="field">기간<select id="range"><option value="6">최근 6개월</option><option value="12" selected>최근 12개월</option><option value="24">최근 24개월</option></select></label>
        <label class="field">기준월<select id="reference"></select></label>
        <button type="button" id="csv" class="outline push">CSV 다운로드</button>
      </div>
      <div id="monthly-empty" class="panel empty" hidden>선택한 품목의 월별 데이터를 불러오지 못했습니다.</div>
      <div id="monthly-data">
        <div class="kpis" id="kpis"></div>
        <div class="grid">
          <section class="panel trend" aria-labelledby="trend-title">
            <div class="panel-head">
              <div><h2 id="trend-title">월별 수출 추이</h2><p id="chart-subtitle"></p></div>
              <div class="segmented compact" aria-label="차트 지표">
                <button type="button" data-metric="amount" aria-pressed="true">금액</button>
                <button type="button" data-metric="yoy" aria-pressed="false">YoY</button>
                <button type="button" data-metric="weight" aria-pressed="false">중량</button>
              </div>
            </div>
            <div class="canvas-scroll" id="trend-scroll" tabindex="0" aria-label="월별 차트 스크롤"><canvas id="trend-chart" role="img"></canvas></div>
          </section>
          <section class="panel ranking" aria-labelledby="rank-title">
            <div class="panel-head"><div><h2 id="rank-title">국가별 상위 5</h2><p id="rank-subtitle"></p></div></div>
            <div id="rank"></div>
          </section>
        </div>
        <section class="panel table-panel" aria-labelledby="table-title">
          <div class="panel-head"><div><h2 id="table-title">월별 상세</h2><p id="table-subtitle"></p></div></div>
          <div class="table-scroll"><table><thead><tr><th scope="col">월</th><th scope="col">금액 (USD)</th><th scope="col">전년 동월 대비</th><th scope="col">전월 대비</th><th scope="col">순중량 (kg)</th></tr></thead><tbody id="table-body"></tbody></table></div>
        </section>
      </div>
    </section>
    <section id="decile" aria-labelledby="decile-title" hidden>
      <div class="panel decile">
        <div class="panel-head"><div><h2 id="decile-title">10일 단위 수출 비교</h2><p id="decile-description"></p></div></div>
        <div id="decile-result"></div>
        <div class="decile-tools">
          <div class="segmented" id="decile-controls" aria-label="기준 구간" hidden>
            <button type="button" data-cutoff="10" aria-pressed="false">1~10일</button>
            <button type="button" data-cutoff="20" aria-pressed="false">1~20일</button>
            <button type="button" data-cutoff="end" aria-pressed="true">월말</button>
          </div>
          <label class="outline upload">10일 단위 CSV 열기<input type="file" id="decile-file" accept=".csv,text/csv"></label>
          <button type="button" id="template" class="text-button">CSV 양식 받기</button>
        </div>
        <p id="decile-status" class="muted" role="status"></p>
        <div id="decile-chart-wrap" hidden>
          <div class="legend"><span><i class="first"></i>1~10일</span><span><i class="second"></i>11~20일</span><span><i class="third"></i>21일~말일</span><span><i class="line"></i>동일 구간 YoY</span></div>
          <div class="canvas-scroll" id="decile-scroll" tabindex="0" aria-label="10일 단위 차트 스크롤"><canvas id="decile-chart" role="img"></canvas></div>
          <div class="table-scroll"><table><thead><tr><th>월</th><th>1~10일</th><th>11~20일</th><th>21일~말일</th><th>선택 구간 누계 (USD)</th><th>동일 구간 YoY</th></tr></thead><tbody id="decile-table"></tbody></table></div>
        </div>
      </div>
    </section>
    <details class="method" id="method">
      <summary>출처와 집계 기준</summary>
      <div id="method-body"></div>
    </details>
    <footer><span>한국 수출입 트래커</span><span id="snapshot-date"></span></footer>
  </main>
</body>
</html>
